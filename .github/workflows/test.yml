name: Test

permissions:
  actions: write

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  uv_list_upgrade:
    name: uv list upgradable dependencies
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
      - name: Setup venv with Python ${{ matrix.python-version }}
        run: |
          uv venv --python ${{ matrix.python-version }}
      - name: Analysing upgradable dependencies with uv
        run: |
          uv lock --upgrade
      - name: Print diff using Git
        run: |
          git --no-pager diff
  pylint:
    name: Pylint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
      - name: Setup venv with Python ${{ matrix.python-version }}
        run: |
          uv venv --python ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          uv sync --dev --locked
      - name: Analysing the code with Pylint
        run: |
          git ls-files '*.py' | xargs -r uv run pylint
      - name: Delete cancelled runs in the same concurrency group
        if: matrix.python-version == '3.12'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          gh run list \
            --workflow "${{ github.workflow }}" \
            --commit "$TARGET_SHA" \
            --status cancelled \
            --json databaseId \
            --jq ".[].databaseId | select(. != ${{ github.run_id }})" \
            | xargs -I{} gh run delete {}
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
      - name: Setup venv with Python ${{ matrix.python-version }}
        run: |
          uv venv --python ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          uv sync --dev --locked
      - name: Analysing the code with Pytest
        run: |
          uv run pytest tests/pytest/
  unittest:
    name: Python unittest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
      - name: Setup venv
        run: |
          uv venv
      - name: Install dependencies
        run: |
          uv sync --dev --locked
      - name: Analysing the code with Python unittest
        run: |
          git ls-files 'tests/unittest/*.py' | xargs -r uv run python -m unittest
