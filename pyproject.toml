[build-system]
requires = [
	"hatchling==1.31.0",
]
build-backend = "hatchling.build"

[project]
# Only use lowercase letters and hyphens here
# @see https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#name
# @see https://packaging.python.org/en/latest/specifications/name-normalization/
name = "scaict-uwu"
# PEP 440
# @see https://sethmlarson.dev/pep-440
version = "0.2.0.dev0"
description = "A cat living in SCAICT Discord server."
readme.file = "README.md"
readme.content-type = "text/markdown"
requires-python = ">=3.11, <3.15"
license = "Apache-2.0"
license-files = [
	"LICENSE",
]
# Use Git committer/author name here
authors = [
	{ name = "ChiuDeYuan" },
	{ name = "Each Chen" },
	{ name = "Elvis Mao" },
	{ name = "g4o2" },
	{ name = "Larryeng" },
	{ name = "osga24" },
	{ name = "Winston Sung" },
	{ name = "YuevUwU" },
	{ name = "伊藤蒼太" },
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Environment :: Console",
	"Environment :: Web Environment",
	"Framework :: Flask",
	"Framework :: Pytest",
	"Intended Audience :: Developers",
	"Intended Audience :: Education",
	"Intended Audience :: Information Technology",
	"Natural Language :: Chinese (Traditional)",
	"Operating System :: OS Independent",
	"Programming Language :: JavaScript",
	"Programming Language :: Python",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Programming Language :: SQL",
]
urls.repository = "https://github.com/SCAICT/SCAICT-uwu.git"
urls.issues = "https://github.com/SCAICT/SCAICT-uwu/issues"
dependencies = [
	"flask==3.1.3",
	"google-genai==2.18.0",
	"mysql-connector-python==26.7.0",
	"openai==3.2.0",
	"py-cord==2.8.1",
	"python-dotenv==1.2.2",
	"requests==2.34.2",
]

[dependency-groups]
dev = [
	"black==26.5.1",
	"pylint==4.0.7",
	"pytest==9.1.1",
]
